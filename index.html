      // ==========================================
      // 2. PURE COST CALCULATOR LOGIC (Uses cmsData.calculatorConfig)
      // ==========================================
      function calculateEstimate(params) {
        const cfg = cmsData.calculatorConfig || DEFAULT_CMS_DATA.calculatorConfig;
        const {
          cameraCount = 4,
          brand = 'cpplus',
          cameraType = 'hd',
          resolution = '2mp',
          storageDays = 30,
          includeInstallation = true,
        } = params;

        let perCameraPrice = Number(cfg.hd2mp) || 1150;
        if (cameraType === 'hd') {
          if (resolution === '2mp') perCameraPrice = Number(cfg.hd2mp) || 1150;
          else if (resolution === '3mp') perCameraPrice = Number(cfg.hd3mp) || 1450;
          else if (resolution === '5mp') perCameraPrice = Number(cfg.hd5mp) || 1950;
          else if (resolution === '4k') perCameraPrice = Number(cfg.hd4k) || 3200;
        } else if (cameraType === 'ip') {
          if (resolution === '2mp') perCameraPrice = Number(cfg.ip2mp) || 1850;
          else if (resolution === '3mp') perCameraPrice = Number(cfg.ip3mp) || 2250;
          else if (resolution === '5mp') perCameraPrice = Number(cfg.ip5mp) || 2950;
          else if (resolution === '4k') perCameraPrice = Number(cfg.ip4k) || 4500;
        } else if (cameraType === 'wifi') {
          const baseWifi = Number(cfg.wifiCam) || 1900;
          perCameraPrice = resolution === '2mp' ? baseWifi : resolution === '3mp' ? baseWifi + 400 : baseWifi + 900;
        } else if (cameraType === 'solar') {
          const baseSolar = Number(cfg.solarCam) || 4600;
          perCameraPrice = resolution === '2mp' ? baseSolar : baseSolar + 1000;
        }

        const brandMultipliers = {
          economy: 0.9,
          cpplus: 1.0,
          hikvision: 1.08,
          dahua: 1.05,
        };
        const multiplier = brandMultipliers[brand] || 1.0;
        const baseCameraCost = Math.round(perCameraPrice * cameraCount * multiplier);

        let recorderCost = 0;
        let recommendedRecorder = 'None (SD Card Based)';
        if (cameraType === 'hd') {
          if (cameraCount <= 4) {
            recorderCost = Number(cfg.dvr4ch) || 2400;
            recommendedRecorder = '4-Channel Full HD DVR';
          } else if (cameraCount <= 8) {
            recorderCost = Number(cfg.dvr8ch) || 3600;
            recommendedRecorder = '8-Channel Full HD DVR';
          } else if (cameraCount <= 16) {
            recorderCost = Number(cfg.dvr16ch) || 6500;
            recommendedRecorder = '16-Channel Full HD DVR';
          } else {
            recorderCost = (Number(cfg.dvr16ch) || 6500) * 1.8;
            recommendedRecorder = '32-Channel Hybrid DVR';
          }
        } else if (cameraType === 'ip') {
          if (cameraCount <= 4) {
            recorderCost = Number(cfg.nvr4ch) || 3800;
            recommendedRecorder = '4-Channel 4K PoE NVR';
          } else if (cameraCount <= 8) {
            recorderCost = Number(cfg.nvr8ch) || 5400;
            recommendedRecorder = '8-Channel 4K PoE NVR';
          } else if (cameraCount <= 16) {
            recorderCost = Number(cfg.nvr16ch) || 8900;
            recommendedRecorder = '16-Channel 4K PoE NVR';
          } else {
            recorderCost = (Number(cfg.nvr16ch) || 8900) * 1.8;
            recommendedRecorder = '32-Channel Enterprise NVR';
          }
        } else {
          recorderCost = cameraCount * 450;
          recommendedRecorder = `${cameraCount}x High Endurance MicroSD Cards (64GB/128GB)`;
        }

        let storageCost = 0;
        let recommendedHardDisk = '64GB MicroSD';
        if (cameraType === 'hd' || cameraType === 'ip') {
          const totalCapNeeded = (cameraCount * storageDays) / 60;
          if (totalCapNeeded <= 1) {
            storageCost = Number(cfg.hdd1tb) || 3300;
            recommendedHardDisk = '1TB Surveillance Hard Disk (WD Purple / Seagate)';
          } else if (totalCapNeeded <= 2) {
            storageCost = Number(cfg.hdd2tb) || 4800;
            recommendedHardDisk = '2TB Surveillance Hard Disk (WD Purple)';
          } else if (totalCapNeeded <= 4) {
            storageCost = Number(cfg.hdd4tb) || 7900;
            recommendedHardDisk = '4TB Surveillance 24x7 Hard Disk';
          } else {
            storageCost = Math.round((Number(cfg.hdd4tb) || 7900) * 1.7);
            recommendedHardDisk = '6TB - 8TB Enterprise Surveillance HDD';
          }
        }

        const accPerCam = Number(cfg.accessoriesPerCam) || 350;
        let accessoriesCost = 0;
        if (cameraType === 'hd' || cameraType === 'ip') {
          accessoriesCost = Math.round(cameraCount * accPerCam + 600);
        } else {
          accessoriesCost = cameraCount * 200;
        }

        const instPerCam = Number(cfg.installPerCam) || 350;
        const installationCost = includeInstallation ? Math.round(cameraCount * instPerCam) : 0;
        const subtotal = baseCameraCost + storageCost + recorderCost + accessoriesCost + installationCost;
        const discPct = Number(cfg.discountPercent) || 12;
        const discount = Math.round(subtotal * (discPct / 100));
        const totalEstimatedPrice = subtotal - discount;

        return {
          baseCameraCost,
          storageCost,
          recorderCost,
          accessoriesCost,
          installationCost,
          subtotal,
          discount,
          discountPercent: discPct,
          totalEstimatedPrice,
          recommendedHardDisk,
          recommendedRecorder,
        };
      }
